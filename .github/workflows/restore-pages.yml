name: Restore previous release

# Временный воркфлоу: возвращает релиз echo-latest с прежним APK (сборка 1.0.71
# из ветки arena/9e90206b-test). После отработки удаляется вместе с отчётом.
on:
  push:
    branches:
      - arena/d02175e8-test
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Restore release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          {
            echo "== скачиваю прежний APK"
            mkdir -p out
            gh api "repos/${{ github.repository }}/actions/artifacts/12523718937/zip" > old.zip && unzip -q old.zip -d out
            ls -la out
            echo "== version.json"; cat out/version.json; echo
            echo "== удаляю текущий релиз"
            gh release delete echo-latest --cleanup-tag --yes 2>&1
            echo "== создаю релиз заново"
            gh release create echo-latest out/echo.apk out/version.json \
              --title "Echo APK (latest build)" \
              --notes "Сборка из коммита a7dffc2 (arena/9e90206b-test). Восстановлено после отката." \
              --prerelease \
              --target a7dffc250d5b03731961352886338de70db99820 2>&1
            echo "== итог"
            gh release view echo-latest --json tagName,assets 2>&1
          } > rel.txt 2>&1
          cat rel.txt

      - name: Publish report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          content=$(base64 -w0 rel.txt 2>/dev/null || echo "нет отчёта" | base64 -w0)
          sha=$(gh api "repos/${{ github.repository }}/contents/rel.txt" -q .sha 2>/dev/null || true)
          args=(-X PUT "repos/${{ github.repository }}/contents/rel.txt" -f message="restore report" -f content="$content" -f branch="${GITHUB_REF_NAME}")
          if [ -n "$sha" ]; then args+=(-f sha="$sha"); fi
          gh api "${args[@]}" > /dev/null || true
