name: Android APK

on:
  push:
    branches:
      - main
      - 'arena/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Collect web files
        run: |
          mkdir -p "$RUNNER_TEMP/app/www"
          cp index.html style.css game.js track.m4a "$RUNNER_TEMP/app/www/"
          cp -r assets "$RUNNER_TEMP/app/www/"
          cat > "$RUNNER_TEMP/app/capacitor.config.json" <<'EOF'
          {
            "appId": "com.forcontact655.test",
            "appName": "Test",
            "webDir": "www"
          }
          EOF

      - name: Install Capacitor
        working-directory: ${{ runner.temp }}/app
        run: |
          npm init -y > /dev/null
          npm install @capacitor/core@8.5.3 @capacitor/cli@8.5.3 @capacitor/android@8.5.3

      - name: Generate Android project
        working-directory: ${{ runner.temp }}/app
        run: |
          npx cap add android
          sed -i 's/android:name=".MainActivity"/android:name=".MainActivity" android:screenOrientation="sensorLandscape"/' android/app/src/main/AndroidManifest.xml
          grep -q 'sensorLandscape' android/app/src/main/AndroidManifest.xml
          npx cap sync android

      - name: Build debug APK
        working-directory: ${{ runner.temp }}/app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Check APK contents
        working-directory: ${{ runner.temp }}/app
        run: |
          apk=android/app/build/outputs/apk/debug/app-debug.apk
          unzip -l "$apk" > apk-list.txt
          grep -q 'assets/public/index.html' apk-list.txt
          grep -q 'assets/public/game.js' apk-list.txt
          grep -q 'assets/public/style.css' apk-list.txt
          grep -q 'assets/public/track.m4a' apk-list.txt
          grep -q 'assets/public/assets/bg.jpg' apk-list.txt
          if grep -qi '\.pez' apk-list.txt; then exit 1; fi
          grep -q 'META-INF/' apk-list.txt
          ls -la "$apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: test-debug-apk
          path: ${{ runner.temp }}/app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk=${{ runner.temp }}/app/android/app/build/outputs/apk/debug/app-debug.apk
          cp "$apk" "$RUNNER_TEMP/test-game-debug.apk"
          gh release delete apk-latest --cleanup-tag --yes || true
          gh release create apk-latest "$RUNNER_TEMP/test-game-debug.apk" \
            --title "Test APK (последняя сборка)" \
            --notes "Сборка из коммита ${GITHUB_SHA:0:7} (${GITHUB_REF_NAME}). Обновляется при каждом пуше в ветки arena." \
            --prerelease \
            --target "$GITHUB_SHA"
