<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#17212b">
  <meta name="description" content="Gemgram: мессенджер в стиле Telegram, демо-версия с хранением на устройстве">
  <title>Gemgram</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icon.png">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <aside id="side">
      <header class="side-head">
        <button id="menu-btn" class="icon-btn" type="button" aria-label="Меню"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
        <label class="search-box"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><input id="search" type="search" placeholder="Поиск" autocomplete="off"></label>
        <button id="new-btn" class="icon-btn" type="button" aria-label="Новый чат"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
      </header>
      <nav id="folders" class="folders"></nav>
      <div id="chats" class="chats"></div>
    </aside>

    <main id="main">
      <div id="empty" class="empty">
        <div class="empty-card">
          <div class="empty-logo">G</div>
          <div class="empty-title">Gemgram</div>
          <div class="empty-sub">Выбери чат слева или создай новый</div>
        </div>
      </div>

      <div id="chat" class="chat hidden">
        <header class="chat-head">
          <button id="back-btn" class="icon-btn back" type="button" aria-label="Назад"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
          <div id="chat-avatar" class="avatar sm"></div>
          <div class="chat-title-box">
            <div id="chat-title" class="chat-title"></div>
            <div id="chat-sub" class="chat-sub"></div>
          </div>
          <button id="chat-search-btn" class="icon-btn" type="button" aria-label="Поиск в чате"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg></button>
          <button id="chat-menu-btn" class="icon-btn" type="button" aria-label="Меню чата"><svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="12" cy="19" r="1.6"/></svg></button>
        </header>
        <div id="chat-search" class="chat-search hidden">
          <input id="chat-search-input" type="search" placeholder="Поиск в чате" autocomplete="off">
          <span id="chat-search-count"></span>
        </div>
        <div class="msgs-wrap">
          <div id="messages" class="messages"></div>
          <button id="to-bottom" class="to-bottom hidden" type="button" aria-label="Вниз"><svg viewBox="0 0 24 24"><path d="M12 5v14M6 13l6 6 6-6"/></svg></button>
        </div>
        <div id="reply-bar" class="bar hidden"></div>
        <div id="edit-bar" class="bar hidden"></div>
        <div id="readonly" class="readonly hidden">В канале писать могут только админы</div>
        <div id="emoji-pick" class="emoji-pick hidden"></div>
        <form id="composer" class="composer">
          <button id="attach-btn" class="icon-btn" type="button" aria-label="Прикрепить фото"><svg viewBox="0 0 24 24"><path d="M21 11l-8.5 8.5a5 5 0 01-7-7L14 4a3.5 3.5 0 015 5l-8.5 8.5a2 2 0 01-3-3L15 7"/></svg></button>
          <input id="file" type="file" accept="image/jpeg,image/png,image/webp,image/gif,image/heic" hidden>
          <textarea id="input" rows="1" placeholder="Сообщение" maxlength="4096"></textarea>
          <button id="emoji-btn" class="icon-btn" type="button" aria-label="Смайлы"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8.5 14.5c1 1.2 2 1.8 3.5 1.8s2.5-.6 3.5-1.8M9 9.5h.01M15 9.5h.01"/></svg></button>
          <button id="send-btn" class="send-btn" type="submit" aria-label="Отправить"><svg viewBox="0 0 24 24"><path d="M4 12l16-8-6 16-3-7z"/></svg></button>
        </form>
      </div>
    </main>
  </div>

  <div id="ctx" class="ctx hidden"></div>

  <div id="sheet" class="sheet hidden">
    <div class="sheet-card">
      <div class="sheet-head">
        <b id="sheet-title"></b>
        <button id="sheet-close" class="icon-btn" type="button" aria-label="Закрыть"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </div>
      <div id="sheet-body" class="sheet-body"></div>
    </div>
  </div>

  <div id="toasts" class="toasts"></div>
  <script src="app.js"></script>
</body>
</html>
