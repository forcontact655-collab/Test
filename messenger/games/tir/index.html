<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Тир без JS</title>
<style>
/* Тир на чистом CSS: нажатие на мишень = checkbox, счёт = :has(), таймер = animation. */
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#0f0a1d;color:#f5f2ff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.field{position:fixed;inset:0;background:radial-gradient(900px 600px at 10% -10%,#2a1857 0%,transparent 60%),radial-gradient(800px 500px at 110% 110%,#3b1258 0%,transparent 55%),#0f0a1d}
.hud{position:fixed;top:0;left:0;right:0;padding:16px 16px 0;text-align:center;z-index:5;pointer-events:none}
.title{font-size:20px;font-weight:750;letter-spacing:.3px}
.sub{margin-top:4px;font-size:13px;color:#9f94c4}
.pips{display:flex;justify-content:center;gap:8px;margin-top:12px}
.pip{width:16px;height:16px;border-radius:50%;background:#2b2050;transition:background-color .2s,box-shadow .2s}
.timer{position:fixed;left:0;bottom:0;height:6px;width:100%;background:linear-gradient(90deg,#7c3aed,#e879f9);transform-origin:left;animation:tick 30s linear forwards;z-index:5}
@keyframes tick{from{transform:scaleX(1)}to{transform:scaleX(0)}}
.target{position:absolute;top:var(--y);left:0;width:64px;height:64px;margin-top:-32px;border-radius:50%;cursor:pointer;background:radial-gradient(circle at 35% 35%,#fff 0 8%,#fb7185 9% 30%,#f5f2ff 31% 48%,#7c3aed 49% 100%);box-shadow:0 8px 20px rgba(5,2,15,.5);animation:fly var(--t) linear var(--d) infinite alternate}
.target:hover{filter:brightness(1.12)}
.target:active{transform:scale(.92)}
.target input{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
.target:has(input:checked){display:none}
@keyframes fly{from{transform:translateX(-90px)}to{transform:translateX(calc(100vw + 20px))}}
.over{position:fixed;inset:0;display:grid;place-items:center;align-content:center;gap:12px;padding:24px;text-align:center;background:rgba(15,10,29,.88);backdrop-filter:blur(6px);z-index:10;visibility:hidden;animation:show 0s 30s forwards;pointer-events:auto}
@keyframes show{to{visibility:visible}}
.over h2{margin:0;font-size:26px;font-weight:750}
.over p{margin:0;color:#c4b5fd;line-height:1.5;max-width:300px}
.again{display:inline-block;margin-top:8px;padding:12px 22px;border-radius:14px;background:linear-gradient(135deg,#7c3aed,#c026d3);color:#fff;font-weight:650;text-decoration:none;box-shadow:0 10px 28px rgba(192,38,211,.3)}
/* подсветка попаданий: счёт — число зелёных/фиолетовых пипсов */
body:has(#h1:checked) .p1 { background: #c084fc; box-shadow: 0 0 10px #c084fc; }
body:has(#h2:checked) .p2 { background: #c084fc; box-shadow: 0 0 10px #c084fc; }
body:has(#h3:checked) .p3 { background: #c084fc; box-shadow: 0 0 10px #c084fc; }
body:has(#h4:checked) .p4 { background: #c084fc; box-shadow: 0 0 10px #c084fc; }
body:has(#h5:checked) .p5 { background: #c084fc; box-shadow: 0 0 10px #c084fc; }
body:has(#h6:checked) .p6 { background: #c084fc; box-shadow: 0 0 10px #c084fc; }
body:has(#h7:checked) .p7 { background: #c084fc; box-shadow: 0 0 10px #c084fc; }
body:has(#h8:checked) .p8 { background: #c084fc; box-shadow: 0 0 10px #c084fc; }
body:has(#h9:checked) .p9 { background: #c084fc; box-shadow: 0 0 10px #c084fc; }
body:has(#h10:checked) .p10 { background: #c084fc; box-shadow: 0 0 10px #c084fc; }
/* маленький экран: мишени крупнее */
@media (max-width:480px){.target{width:72px;height:72px;margin-top:-36px}}
</style>
</head>
<body>
<main class="field">
  <label class="target" style="--y:14vh;--t:2.6s;--d:-0.0s"><input type="checkbox" id="h1" aria-label="мишень 1"></label>
  <label class="target" style="--y:26vh;--t:3.4s;--d:-0.9s"><input type="checkbox" id="h2" aria-label="мишень 2"></label>
  <label class="target" style="--y:38vh;--t:2.2s;--d:-1.8s"><input type="checkbox" id="h3" aria-label="мишень 3"></label>
  <label class="target" style="--y:50vh;--t:3.8s;--d:-2.7s"><input type="checkbox" id="h4" aria-label="мишень 4"></label>
  <label class="target" style="--y:62vh;--t:2.9s;--d:-3.6s"><input type="checkbox" id="h5" aria-label="мишень 5"></label>
  <label class="target" style="--y:74vh;--t:3.1s;--d:-4.5s"><input type="checkbox" id="h6" aria-label="мишень 6"></label>
  <label class="target" style="--y:20vh;--t:4.2s;--d:-5.4s"><input type="checkbox" id="h7" aria-label="мишень 7"></label>
  <label class="target" style="--y:32vh;--t:2.5s;--d:-6.3s"><input type="checkbox" id="h8" aria-label="мишень 8"></label>
  <label class="target" style="--y:56vh;--t:3.6s;--d:-7.2s"><input type="checkbox" id="h9" aria-label="мишень 9"></label>
  <label class="target" style="--y:68vh;--t:2.8s;--d:-8.1s"><input type="checkbox" id="h10" aria-label="мишень 10"></label>
</main>
<header class="hud">
  <div class="title">Тир без JS</div>
  <div class="sub">Нажимай на мишени, пока идёт таймер (30 сек)</div>
  <div class="pips">
      <i class="pip p1"></i>
      <i class="pip p2"></i>
      <i class="pip p3"></i>
      <i class="pip p4"></i>
      <i class="pip p5"></i>
      <i class="pip p6"></i>
      <i class="pip p7"></i>
      <i class="pip p8"></i>
      <i class="pip p9"></i>
      <i class="pip p10"></i>
  </div>
</header>
<div class="timer" aria-hidden="true"></div>
<section class="over" aria-live="polite">
  <h2>Время вышло</h2>
  <p>Считай фиолетовые точки: каждая — одно попадание. Из 10 мишеней.</p>
  <a class="again" href="">Ещё раз</a>
</section>
</body>
</html>
