<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#120d1c">
  <title>Gemshaft</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header id="top">
      <div class="gem-box">
        <span id="gems">0</span>
        <small id="rate">+0/с</small>
      </div>
      <div class="meta">
        <span id="crys">Кристаллы: 0</span>
        <span id="ach-count">Достижения: 0/30</span>
      </div>
      <div class="actions">
        <div class="modes">
          <button class="mode on" type="button" data-mode="1">x1</button>
          <button class="mode" type="button" data-mode="10">x10</button>
          <button class="mode" type="button" data-mode="100">x100</button>
          <button class="mode" type="button" data-mode="0">MAX</button>
        </div>
        <button id="maxall" class="pill" type="button">Купить всё</button>
        <button id="ach-btn" class="pill" type="button">Достижения</button>
        <button id="sound-btn" class="pill" type="button">Звук: вкл</button>
      </div>
    </header>

    <div class="wrap">
      <section id="tiers"></section>
      <section id="layers">
        <div class="layer" id="tempo-box">
          <div class="l-top"><b>Темп</b><span id="tempo-info"></span></div>
          <div class="l-desc">Ускоряет всё производство. Сбрасывается Стволом и Обвалом.</div>
          <button id="tempo-btn" class="btn" type="button"></button>
        </div>
        <div class="layer" id="boost-box">
          <div class="l-top"><b>Проходка</b><span id="boost-info"></span></div>
          <div class="l-desc" id="boost-note"></div>
          <button id="boost-btn" class="btn" type="button"></button>
        </div>
        <div class="layer" id="shaft-box">
          <div class="l-top"><b>Ствол</b><span id="shaft-info"></span></div>
          <div class="l-desc" id="shaft-note"></div>
          <button id="shaft-btn" class="btn" type="button"></button>
        </div>
        <div class="layer" id="collapse-box">
          <div class="l-top"><b>Обвал</b><span id="collapse-info"></span></div>
          <div class="l-desc" id="collapse-note"></div>
          <button id="collapse-btn" class="btn" type="button"></button>
        </div>
      </section>
    </div>

    <div id="toasts"></div>

    <div id="ach-view" class="modal">
      <div class="card ach-card">
        <h2>Достижения</h2>
        <p id="ach-sum"></p>
        <div id="ach-list" class="ach-list"></div>
        <div class="modal-actions">
          <button id="ach-close" class="btn primary" type="button">Закрыть</button>
        </div>
      </div>
    </div>

    <div id="modal" class="modal">
      <div class="card">
        <h2 id="modal-title"></h2>
        <p id="modal-text"></p>
        <div class="modal-actions">
          <button id="modal-cancel" class="btn" type="button">Отмена</button>
          <button id="modal-ok" class="btn primary" type="button">Ок</button>
        </div>
      </div>
    </div>
  </div>
  <script src="game.js"></script>
</body>
</html>
