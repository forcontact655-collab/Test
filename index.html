<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#2b1d08">
  <title>Медовый рой</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <canvas id="scene"></canvas>

    <header id="top">
      <div class="honey-box">
        <span id="honey">0</span>
        <small id="rate">+0/с</small>
      </div>
      <div class="pills">
        <button id="royal-btn" class="pill" type="button" disabled>Новый рой</button>
        <button id="sound-btn" class="pill" type="button">Звук: вкл</button>
      </div>
    </header>

    <aside id="shop">
      <div class="shop-head">
        <div>
          <b>Улей</b>
          <small id="stats">Пчёл 1 · Цветов 3</small>
        </div>
        <div class="modes">
          <button class="mode on" type="button" data-mode="1">x1</button>
          <button class="mode" type="button" data-mode="10">x10</button>
          <button class="mode" type="button" data-mode="100">x100</button>
        </div>
      </div>
      <div id="items"></div>
    </aside>

    <div id="toasts"></div>

    <div id="modal" class="modal">
      <div class="card">
        <h2 id="modal-title"></h2>
        <p id="modal-text"></p>
        <div class="modal-actions">
          <button id="modal-cancel" class="btn" type="button">Отмена</button>
          <button id="modal-ok" class="btn primary" type="button">Ок</button>
        </div>
      </div>
    </div>
  </div>
  <script src="game.js"></script>
</body>
</html>
